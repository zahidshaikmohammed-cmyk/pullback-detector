name: live-dhan-connectivity

on:
  workflow_dispatch:
  schedule:
    # 09:20 IST on weekdays (03:50 UTC). GitHub may delay scheduled jobs.
    - cron: "50 3 * * 1-5"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      APP_ENV: live-validation
      LOG_LEVEL: INFO
      LIVE_DURATION_SECONDS: 600
      MIN_LIVE_INSTRUMENTS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - name: Run Dhan live connectivity validation
        run: python -m pullback_detector
      - name: Upload Dhan evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhan-live-evidence-${{ github.run_id }}
          path: data/runtime/
          if-no-files-found: warn
          retention-days: 14
